<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>קליניקה — אנשי קשר</title>
<style>
  html{color-scheme:light; forced-color-adjust:none;}
  :root{
    --bg-a:#eef6fc; --bg-b:#e0edf9;
    --navy:#0d1b3e; --blue:#2f6fed; --blue-light:#dfeafd;
    --warn:#e0a24b; --warn-light:#fdf1e0;
    --card:#ffffff; --text:#16233f; --muted:#5c6c88;
    --danger:#c0524a; --ok:#2f9e6b; --border:#e2ebf7;
  }
  *{box-sizing:border-box; forced-color-adjust:none;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; color:var(--text); min-height:100vh; padding-bottom:40px;
    background-color:var(--bg-a);
    background-image:
      radial-gradient(circle at 30% 0%, rgba(255,255,255,.6), transparent 55%),
      linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%),
      linear-gradient(rgba(13,27,62,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,27,62,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
    background-attachment: fixed;
  }
  header{padding:16px 16px 14px; text-align:center; border-bottom:1px solid var(--border); background:rgba(255,255,255,.85); backdrop-filter:blur(6px); position:sticky; top:0; z-index:10; box-shadow:0 4px 14px rgba(13,27,62,.08);}
  .header-icon{display:flex; justify-content:center; margin-bottom:6px; filter:drop-shadow(0 4px 6px rgba(13,27,62,.25));}
  header h1{margin:0; font-size:19px; color:var(--navy); font-weight:800; letter-spacing:.2px;}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .container{max-width:640px; margin:0 auto; padding:16px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .card{
    background-color:var(--card);
    background-image:linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    border:1px solid var(--border); border-top:3px solid var(--blue); border-radius:20px; padding:18px; margin-bottom:14px;
    box-shadow: 0 14px 28px rgba(13,27,62,.10), 0 3px 8px rgba(13,27,62,.06), inset 0 1px 0 rgba(255,255,255,.8);
  }
  input[type=text], input[type=tel], input[type=date], textarea{
    width:100%; background-color:#fff; background-image:linear-gradient(180deg,#fbfdff,#ffffff);
    border:1.5px solid var(--border); color:var(--text); border-radius:12px; padding:10px 12px; font-size:15px; margin-top:4px; font-family:inherit;
    box-shadow: inset 0 2px 5px rgba(13,27,62,.07), inset 0 -1px 0 #fff;
  }
  input[type=text]:focus, input[type=tel]:focus, input[type=date]:focus, textarea:focus{outline:none; border-color:var(--blue); box-shadow: inset 0 2px 5px rgba(13,27,62,.07), 0 0 0 3px var(--blue-light);}
  textarea{min-height:160px; resize:vertical; line-height:1.5;}
  label{font-size:13px; color:var(--muted); display:block; margin-top:10px;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:999px; font-size:15px; padding:13px 18px; -webkit-appearance:none; appearance:none; transition:transform .08s ease, box-shadow .12s ease;}
  .btn-primary{
    background-image:linear-gradient(180deg, #4d84ff 0%, #2f6fed 55%, #2560d8 100%); color:#ffffff; font-weight:700; width:100%; margin-top:14px;
    box-shadow: 0 10px 20px rgba(47,111,237,.38), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.15);
  }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 4px 10px rgba(47,111,237,.3), inset 0 2px 5px rgba(0,0,0,.2); }
  .btn-secondary{
    background-color:#ffffff; background-image:linear-gradient(180deg,#ffffff,#f1f6fd); color:var(--blue); border:1.5px solid var(--blue); width:100%; margin-top:8px; font-weight:600;
    box-shadow: 0 6px 14px rgba(13,27,62,.09), inset 0 1px 0 #fff;
  }
  .btn-secondary:active{ transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(13,27,62,.12); }
  .btn-danger{
    background-color:#ffffff; background-image:linear-gradient(180deg,#ffffff,#fdf3f2); color:var(--danger); border:1.5px solid var(--danger); width:100%; margin-top:8px; padding:10px; font-weight:600;
    box-shadow: 0 6px 14px rgba(192,82,74,.12), inset 0 1px 0 #fff;
  }
  .btn-danger:active{ transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(192,82,74,.15); }
  .btn-small{
    background-color:var(--blue-light); background-image:linear-gradient(180deg,#eaf3ff,#d7e8fd); color:var(--blue); border:none; padding:7px 14px; font-size:13px; font-weight:600;
    box-shadow: 0 4px 10px rgba(47,111,237,.18), inset 0 1px 0 #fff;
  }
  .btn-small:active{ transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(47,111,237,.2); }
  .btn-back{background:none; color:var(--muted); padding:4px 0; font-size:14px; border-radius:0; box-shadow:none;}
  .search-box{margin-bottom:10px;}
  .list-item{
    background-color:#fff; background-image:linear-gradient(180deg,#ffffff,#fafcff);
    border:1px solid var(--border); border-right:4px solid var(--blue); border-radius:16px; padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    box-shadow: 0 8px 18px rgba(13,27,62,.09), 0 2px 4px rgba(13,27,62,.05), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .08s ease, box-shadow .12s ease;
  }
  .list-item:active{background-color:var(--blue-light); transform:translateY(1px); box-shadow: inset 0 2px 5px rgba(13,27,62,.1);}
  .list-item .name{font-weight:700; color:var(--navy);}
  .list-item .sub2{font-size:12px; color:var(--muted); margin-top:2px;}
  .empty{color:var(--muted); text-align:center; padding:24px 0; font-size:14px;}
  .customer-header{
    margin-bottom:12px; background-color:var(--navy); background-image:linear-gradient(135deg, #16295c, var(--navy) 60%, #0a1330); color:#fff; border-radius:16px; padding:16px 18px;
    box-shadow: 0 16px 30px rgba(13,27,62,.35), inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 6px rgba(0,0,0,.25);
  }
  .customer-header .name{font-size:18px; font-weight:700; color:#fff;}
  .customer-header .detail{font-size:13px; color:#b7c4e0; margin-top:2px;}
  .exam-item{
    background-color:#fff; background-image:linear-gradient(180deg,#ffffff,#fafcff);
    border:1px solid var(--border); border-right:4px solid var(--ok); border-radius:16px; padding:12px; margin-top:10px; cursor:pointer;
    box-shadow: 0 8px 18px rgba(13,27,62,.09), 0 2px 4px rgba(13,27,62,.05), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .08s ease, box-shadow .12s ease;
  }
  .exam-item:active{background-color:var(--blue-light); transform:translateY(1px); box-shadow: inset 0 2px 5px rgba(13,27,62,.1);}
  .exam-date{font-size:12px; color:var(--blue); font-weight:700;}
  .exam-preview{font-size:13px; color:var(--muted); margin-top:4px; white-space:pre-wrap; max-height:60px; overflow:hidden;}
  .field-hint{font-size:11px; color:var(--muted); margin-top:4px;}
  .backup-banner{
    background-color:var(--warn-light); background-image:linear-gradient(180deg,#fff6e6,#fbecd3);
    border:1px solid var(--warn); border-radius:16px; padding:14px; margin-bottom:14px;
    box-shadow: 0 10px 22px rgba(224,162,75,.18), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .backup-banner .title{font-weight:700; color:#8a5a1a; margin-bottom:4px;}
  .backup-banner .text{font-size:13px; color:var(--text); margin-bottom:10px;}
  .backup-banner .btn-primary{background-image:linear-gradient(180deg,#f0b56a,var(--warn) 60%,#c98a3f); color:#241a0d; box-shadow: 0 10px 20px rgba(224,162,75,.4), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.15);}
  .backup-row{display:flex; gap:8px;}
  .backup-row button{flex:1;}
  .settings-card summary{cursor:pointer; color:var(--muted); font-size:13px;}
  .minimal-row{display:flex; align-items:center; justify-content:space-between; padding:6px 4px 18px;}
  .link-btn{background:none; border:none; color:var(--blue); font-weight:700; font-size:15px; padding:8px 6px; display:flex; align-items:center; gap:6px; border-radius:8px; box-shadow:none;}
  .link-btn:active{background:var(--blue-light); transform:translateY(1px);}
  .icon-round-btn{
    width:46px; height:46px; border-radius:50%;
    background-color:var(--blue-light); background-image:radial-gradient(circle at 32% 28%, #f2f8ff, var(--blue-light) 70%);
    color:var(--blue); display:flex; align-items:center; justify-content:center; font-size:18px; border:none; padding:0;
    box-shadow: 0 8px 16px rgba(47,111,237,.28), inset 0 1px 0 #fff, inset 0 -3px 5px rgba(47,111,237,.18);
  }
  .icon-round-btn:active{ transform: translateY(1px) scale(.96); box-shadow: inset 0 3px 6px rgba(47,111,237,.3); }
</style>
</head>
<body>

<header>
  <div class="header-icon" id="header-icon">
    <svg width="76" height="34" viewBox="0 0 250 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- temple stubs -->
      <rect x="48" y="48" width="16" height="14" rx="3" fill="#0d0f10"/>
      <rect x="226" y="48" width="16" height="14" rx="3" fill="#0d0f10"/>
      <!-- bridge -->
      <rect x="134" y="48" width="22" height="14" rx="6" fill="#0d0f10"/>
      <!-- lenses -->
      <circle cx="100" cy="55" r="38" stroke="#0d0f10" stroke-width="14"/>
      <circle cx="190" cy="55" r="38" stroke="#0d0f10" stroke-width="14"/>
      <!-- left lens: crosshair -->
      <line x1="100" y1="35" x2="100" y2="75" stroke="#29c9e6" stroke-width="7" stroke-linecap="round"/>
      <line x1="80" y1="55" x2="120" y2="55" stroke="#29c9e6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="100" cy="55" r="6" fill="#ffffff"/>
      <!-- right lens: target -->
      <circle cx="190" cy="55" r="16" stroke="#f4703c" stroke-width="6"/>
      <circle cx="190" cy="55" r="6" fill="#f4703c"/>
    </svg>
  </div>
  <h1>מאגר לקוחות — קליניקה</h1>
</header>

<div class="container">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div id="backup-banner-slot"></div>
    <div class="card">
      <label>חיפוש לקוח (שם פרטי / משפחה)</label>
      <input type="text" id="search-input" class="search-box" placeholder="הקלד לחיפוש...">
      <div id="customers-list"></div>
      <button class="btn-primary" onclick="startNewCustomer()">+ לקוח חדש</button>
    </div>

    <div class="minimal-row">
      <button class="link-btn" onclick="showScreen('screen-orders')">📒 פנקס הזמנות</button>
      <button class="icon-round-btn" onclick="toggleBackupPanel()" title="גיבוי ושחזור" aria-label="גיבוי ושחזור">💾</button>
    </div>

    <div class="card" id="backup-panel" style="display:none;">
      <div class="field-hint" style="margin-top:0;">גיבוי אחרון: <span id="last-backup-display">מעולם לא</span></div>
      <button class="btn-secondary" onclick="exportBackup()">📤 גבה עכשיו (הורדת קובץ)</button>
      <label>שחזור מקובץ גיבוי</label>
      <input type="file" id="import-file-input" accept="application/json" onchange="handleImportFile(event)">
      <div class="field-hint">שחזור מוחק את כל הנתונים הקיימים ומחליף אותם בגיבוי שנטען.</div>
    </div>
  </div>

  <!-- ORDERS LIST -->
  <div class="screen" id="screen-orders">
    <button class="btn-back" onclick="showScreen('screen-home')">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:700; color:var(--navy);">פנקס הזמנות</div>
      <label>חיפוש (שם לקוח)</label>
      <input type="text" id="order-search-input" placeholder="הקלד לחיפוש...">
      <div id="orders-list"></div>
      <button class="btn-primary" onclick="startNewOrder()">+ הזמנה חדשה</button>
    </div>
  </div>

  <!-- NEW ORDER -->
  <div class="screen" id="screen-order-new">
    <button class="btn-back" onclick="showScreen('screen-orders')">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:700; color:var(--navy); margin-bottom:4px;">הזמנה חדשה</div>
      <div class="field-hint">מספר הזמנה יוקצה אוטומטית בשמירה</div>

      <label>תאריך</label>
      <input type="date" id="of-date">

      <label>שם לקוח</label>
      <input type="text" id="of-customer-name" placeholder="הקלד שם לחיפוש בין הלקוחות..." autocomplete="off" oninput="renderOrderCustomerSuggestions()">
      <div id="order-customer-suggestions"></div>

      <label>פרטי ההזמנה</label>
      <input type="text" id="of-item" value="משקפיים">

      <label>סכום כולל (₪)</label>
      <input type="text" id="of-amount" placeholder="0" inputmode="decimal">

      <label>שולם בעת ההזמנה (₪)</label>
      <input type="text" id="of-paid" placeholder="0" inputmode="decimal">

      <button class="btn-primary" onclick="saveNewOrder()">שמור הזמנה</button>
    </div>
  </div>

  <!-- ORDER DETAIL -->
  <div class="screen" id="screen-order-detail">
    <button class="btn-back" onclick="showScreen('screen-orders')">‹ חזרה לפנקס</button>
    <div class="card">
      <div class="customer-header">
        <div class="name">הזמנה מס' <span id="od-number"></span></div>
        <div class="detail" id="od-customer-name"></div>
        <div class="detail" id="od-date"></div>
      </div>

      <div id="od-view-mode">
        <label>פרטי ההזמנה</label>
        <div id="od-item-display" style="font-size:15px; margin-top:2px;"></div>
        <div class="row" style="display:flex; gap:14px; margin-top:12px;">
          <div><label>סכום כולל</label><div id="od-amount-display" style="font-size:16px; font-weight:700;"></div></div>
          <div><label>שולם</label><div id="od-paid-display" style="font-size:16px; font-weight:700; color:var(--ok);"></div></div>
          <div><label>חוב</label><div id="od-debt-display" style="font-size:16px; font-weight:700;"></div></div>
        </div>
        <button class="btn-small" style="margin-top:12px;" onclick="startEditOrder()">✎ ערוך פרטי הזמנה</button>
      </div>

      <div style="border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:14px;" id="od-payment-form">
        <label style="margin-top:0;">רישום תשלום על החוב</label>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <input type="text" id="op-amount" placeholder="סכום" inputmode="decimal" style="flex:1;">
          <input type="date" id="op-date" style="flex:1;">
        </div>
        <button class="btn-secondary" onclick="addOrderPayment()">רשום תשלום</button>
      </div>

      <label style="margin-top:16px;">היסטוריית תשלומים</label>
      <div id="od-payments-list"></div>

      <button class="btn-danger" onclick="deleteCurrentOrder()">🗑 מחק הזמנה</button>
    </div>
  </div>

  <!-- EDIT ORDER -->
  <div class="screen" id="screen-order-edit">
    <button class="btn-back" onclick="cancelEditOrder()">‹ ביטול</button>
    <div class="card">
      <div style="font-weight:700; color:var(--navy); margin-bottom:4px;">עריכת הזמנה מס' <span id="oe-number"></span></div>

      <label>תאריך</label>
      <input type="date" id="oe-date">

      <label>שם לקוח</label>
      <input type="text" id="oe-customer-name" autocomplete="off" oninput="renderOrderCustomerSuggestions('oe')">
      <div id="order-customer-suggestions-oe"></div>

      <label>פרטי ההזמנה</label>
      <input type="text" id="oe-item">

      <label>סכום כולל (₪)</label>
      <input type="text" id="oe-amount" inputmode="decimal">

      <button class="btn-primary" onclick="saveEditOrder()">שמור שינויים</button>
    </div>
  </div>

  <!-- NEW/EDIT CUSTOMER -->
  <div class="screen" id="screen-customer-form">
    <button class="btn-back" onclick="showScreen('screen-home')">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:600; margin-bottom:4px;" id="customer-form-title">לקוח חדש</div>
      <label>שם פרטי</label>
      <input type="text" id="cf-firstname">
      <label>שם משפחה</label>
      <input type="text" id="cf-lastname">
      <label>טלפון</label>
      <input type="tel" id="cf-phone">
      <label>כתובת</label>
      <input type="text" id="cf-address">
      <button class="btn-primary" onclick="saveCustomer()">שמור</button>
    </div>
  </div>

  <!-- CUSTOMER DETAIL -->
  <div class="screen" id="screen-customer-detail">
    <button class="btn-back" onclick="showScreen('screen-home')">‹ חזרה לחיפוש</button>
    <div class="card">
      <div class="customer-header">
        <div class="name" id="detail-name"></div>
        <div class="detail" id="detail-phone"></div>
        <div class="detail" id="detail-address"></div>
      </div>
      <button class="btn-small" onclick="editCurrentCustomer()">✎ ערוך פרטי לקוח</button>
      <button class="btn-primary" onclick="startNewExam()">+ בדיקה חדשה</button>
      <div id="exams-container"></div>
    </div>
  </div>

  <!-- EXAM EDIT -->
  <div class="screen" id="screen-exam-edit">
    <button class="btn-back" onclick="backFromExam()">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:600;">בדיקה — <span id="exam-customer-name"></span></div>
      <div class="field-hint">תאריך פתיחת הבדיקה: <b id="exam-date-display"></b> (קבוע, לא משתנה בעדכון)</div>
      <label>תוכן הבדיקה (אנגלית)</label>
      <textarea id="exam-text-main" dir="ltr" style="text-align:left;" placeholder="Paste prescription details here..."></textarea>
      <label>הערות נוספות</label>
      <textarea id="exam-text-notes" dir="rtl" style="text-align:right;" placeholder="הערות נוספות בעברית..."></textarea>
      <button class="btn-primary" onclick="saveExam()">שמור בדיקה</button>
      <button class="btn-secondary" onclick="openOrderForExamCustomer()">📒 פתח הזמנה ללקוח זה</button>
      <button class="btn-danger" id="delete-exam-btn" onclick="deleteCurrentExam()" style="display:none;">🗑 מחק בדיקה</button>
    </div>
  </div>

</div>

<script>
/* ---------------- storage ---------------- */
const LS_CUSTOMERS = 'clinica_customers';
const LS_EXAMS = 'clinica_exams';
const LS_LASTBACKUP = 'clinica_lastbackup';
const LS_SNOOZE = 'clinica_snooze';
function getCustomers(){ return JSON.parse(localStorage.getItem(LS_CUSTOMERS) || '[]'); }
function saveCustomers(a){ localStorage.setItem(LS_CUSTOMERS, JSON.stringify(a)); }
function getExams(){ return JSON.parse(localStorage.getItem(LS_EXAMS) || '[]'); }
function saveExams(a){ localStorage.setItem(LS_EXAMS, JSON.stringify(a)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- navigation ---------------- */
let currentCustomerId = null;
let currentExamId = null; // null = creating a new exam
let editingCustomerId = null; // set when editing an existing customer's info

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-home'){ renderCustomersList(); renderBackupBanner(); }
  if(id==='screen-orders'){ renderOrdersList(); }
}

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('he-IL'); }

/* ---------------- customers ---------------- */
function startNewCustomer(){
  editingCustomerId = null;
  document.getElementById('customer-form-title').textContent = 'לקוח חדש';
  document.getElementById('cf-firstname').value='';
  document.getElementById('cf-lastname').value='';
  document.getElementById('cf-phone').value='';
  document.getElementById('cf-address').value='';
  showScreen('screen-customer-form');
}
function editCurrentCustomer(){
  const customers = getCustomers();
  const c = customers.find(x=>x.id===currentCustomerId);
  if(!c) return;
  editingCustomerId = c.id;
  document.getElementById('customer-form-title').textContent = 'עריכת פרטי לקוח';
  document.getElementById('cf-firstname').value = c.firstName;
  document.getElementById('cf-lastname').value = c.lastName;
  document.getElementById('cf-phone').value = c.phone || '';
  document.getElementById('cf-address').value = c.address || '';
  showScreen('screen-customer-form');
}
function saveCustomer(){
  const firstName = document.getElementById('cf-firstname').value.trim();
  const lastName = document.getElementById('cf-lastname').value.trim();
  const phone = document.getElementById('cf-phone').value.trim();
  const address = document.getElementById('cf-address').value.trim();
  if(!firstName){ alert('נא להזין שם פרטי'); return; }
  let customers = getCustomers();
  if(editingCustomerId){
    const c = customers.find(x=>x.id===editingCustomerId);
    if(c){ c.firstName=firstName; c.lastName=lastName; c.phone=phone; c.address=address; }
    saveCustomers(customers);
    currentCustomerId = editingCustomerId;
  } else {
    const c = { id: uid(), firstName, lastName, phone, address };
    customers.push(c);
    saveCustomers(customers);
    currentCustomerId = c.id;
  }
  showScreen('screen-customer-detail');
  renderCustomerDetail(currentCustomerId);
}

/* ---------------- home / search ---------------- */
function renderCustomersList(){
  const q = (document.getElementById('search-input').value || '').trim();
  const customers = getCustomers();
  const container = document.getElementById('customers-list');
  let filtered = customers;
  if(q){
    filtered = customers.filter(c =>
      (c.firstName+' '+c.lastName).includes(q) || c.lastName.includes(q) || c.firstName.includes(q)
    );
  }
  filtered = filtered.slice().reverse();
  if(filtered.length===0){
    container.innerHTML = '<div class="empty">אין לקוחות תואמים</div>';
    return;
  }
  container.innerHTML = '';
  filtered.forEach(c=>{
    const div = document.createElement('div');
    div.className='list-item';
    div.onclick = ()=>{ currentCustomerId = c.id; showScreen('screen-customer-detail'); renderCustomerDetail(c.id); };
    div.innerHTML = `<div><div class="name">${c.firstName} ${c.lastName}</div><div class="sub2">${c.phone||''}</div></div><div>›</div>`;
    container.appendChild(div);
  });
}
document.getElementById('search-input').addEventListener('input', renderCustomersList);

/* ---------------- customer detail / exams list ---------------- */
function renderCustomerDetail(customerId){
  const customers = getCustomers();
  const c = customers.find(x=>x.id===customerId);
  if(!c) return;
  document.getElementById('detail-name').textContent = c.firstName+' '+c.lastName;
  document.getElementById('detail-phone').textContent = c.phone||'';
  document.getElementById('detail-address').textContent = c.address||'';
  const exams = getExams().filter(e=>e.customerId===customerId).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const container = document.getElementById('exams-container');
  if(exams.length===0){
    container.innerHTML = '<div class="empty">אין בדיקות עדיין</div>';
    return;
  }
  container.innerHTML = '';
  exams.forEach(ex=>{
    const div = document.createElement('div');
    div.className='exam-item';
    div.onclick = ()=>{ openExamForEdit(ex.id); };
    div.innerHTML = `<div class="exam-date">${fmtDate(ex.date)}</div><div class="exam-preview">${(ex.text||'').slice(0,140) || '(ריק)'}</div>`;
    container.appendChild(div);
  });
}

/* ---------------- exam edit ---------------- */
function startNewExam(){
  const customers = getCustomers();
  const c = customers.find(x=>x.id===currentCustomerId);
  if(!c) return;
  currentExamId = null;
  document.getElementById('exam-customer-name').textContent = c.firstName+' '+c.lastName;
  document.getElementById('exam-date-display').textContent = fmtDate(todayISO());
  document.getElementById('exam-text-main').value = '';
  document.getElementById('exam-text-notes').value = '';
  document.getElementById('delete-exam-btn').style.display = 'none';
  showScreen('screen-exam-edit');
}
function openExamForEdit(examId){
  const exams = getExams();
  const ex = exams.find(x=>x.id===examId);
  if(!ex) return;
  const customers = getCustomers();
  const c = customers.find(x=>x.id===ex.customerId);
  currentExamId = examId;
  document.getElementById('exam-customer-name').textContent = c ? (c.firstName+' '+c.lastName) : '';
  document.getElementById('exam-date-display').textContent = fmtDate(ex.date);
  document.getElementById('exam-text-main').value = ex.text || '';
  document.getElementById('exam-text-notes').value = ex.notes || '';
  document.getElementById('delete-exam-btn').style.display = 'block';
  showScreen('screen-exam-edit');
}
function persistExamOnly(){
  const text = document.getElementById('exam-text-main').value;
  const notes = document.getElementById('exam-text-notes').value;
  let exams = getExams();
  if(currentExamId){
    const ex = exams.find(x=>x.id===currentExamId);
    if(ex){ ex.text = text; ex.notes = notes; } // date intentionally unchanged
  } else {
    const ex = { id: uid(), customerId: currentCustomerId, date: todayISO(), text, notes };
    exams.push(ex);
    currentExamId = ex.id;
  }
  saveExams(exams);
}
function saveExam(){
  persistExamOnly();
  showScreen('screen-customer-detail');
  renderCustomerDetail(currentCustomerId);
}
function openOrderForExamCustomer(){
  persistExamOnly();
  const c = getCustomers().find(x=>x.id===currentCustomerId);
  if(!c) return;
  startNewOrder();
  document.getElementById('of-customer-name').value = (c.firstName+' '+c.lastName).trim();
  newOrderCustomerId = c.id;
}
function deleteCurrentExam(){
  if(!currentExamId) return;
  if(!confirm('למחוק את הבדיקה הזו? הפעולה לא הפיכה.')) return;
  let exams = getExams();
  exams = exams.filter(x=>x.id!==currentExamId);
  saveExams(exams);
  currentExamId = null;
  showScreen('screen-customer-detail');
  renderCustomerDetail(currentCustomerId);
}
function backFromExam(){
  showScreen('screen-customer-detail');
  renderCustomerDetail(currentCustomerId);
}

/* ---------------- backup / restore ---------------- */
function getLastBackupTs(){
  const v = localStorage.getItem(LS_LASTBACKUP);
  return v ? parseInt(v,10) : null;
}
function setLastBackupTs(ts){ localStorage.setItem(LS_LASTBACKUP, String(ts)); }
function getSnoozeUntil(){
  const v = localStorage.getItem(LS_SNOOZE);
  return v ? parseInt(v,10) : 0;
}
function setSnoozeUntil(ts){ localStorage.setItem(LS_SNOOZE, String(ts)); }

function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    customers: getCustomers(),
    exams: getExams(),
    orders: getOrders()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = todayISO();
  a.href = url;
  a.download = 'clinica-backup-' + dateStr + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setLastBackupTs(Date.now());
  setSnoozeUntil(0);
  renderBackupBanner();
  renderLastBackupDisplay();
  alert('קובץ הגיבוי ירד להורדות. מומלץ להעביר אותו עכשיו לכרטיס USB.');
}

function handleImportFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  if(!confirm('שחזור יחליף את כל הנתונים הקיימים באפליקציה בנתוני הגיבוי. להמשיך?')) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.customers) || !Array.isArray(data.exams)) throw new Error('קובץ לא תקין');
      saveCustomers(data.customers);
      saveExams(data.exams);
      if(Array.isArray(data.orders)) saveOrders(renumberOrders(data.orders));
      alert('השחזור הושלם בהצלחה.');
      showScreen('screen-home');
    } catch(err){
      alert('שגיאה בטעינת קובץ הגיבוי: ' + err.message);
    }
  };
  reader.readAsText(file);
}

const BACKUP_INTERVAL_MS = 90 * 24 * 60 * 60 * 1000; // 3 months
function toggleBackupPanel(){
  const panel = document.getElementById('backup-panel');
  panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
}
function renderLastBackupDisplay(){
  const ts = getLastBackupTs();
  const el = document.getElementById('last-backup-display');
  if(!el) return;
  el.textContent = ts ? new Date(ts).toLocaleDateString('he-IL') : 'מעולם לא';
}
function renderBackupBanner(){
  const slot = document.getElementById('backup-banner-slot');
  if(!slot) return;
  const hasData = getCustomers().length > 0 || getExams().length > 0;
  const lastTs = getLastBackupTs();
  const now = Date.now();
  const overdue = hasData && (!lastTs || (now - lastTs) >= BACKUP_INTERVAL_MS);
  const snoozed = now < getSnoozeUntil();
  if(overdue && !snoozed){
    const monthsText = lastTs ? Math.floor((now-lastTs)/(30*24*60*60*1000)) + ' חודשים' : 'מעולם לא';
    slot.innerHTML = `
      <div class="backup-banner">
        <div class="title">⚠️ מומלץ לגבות את הנתונים</div>
        <div class="text">גיבוי אחרון: ${monthsText}. גבה עכשיו לכרטיס USB כדי לא לאבד נתונים.</div>
        <div class="backup-row">
          <button class="btn-primary" style="margin-top:0;" onclick="exportBackup()">גבה עכשיו</button>
          <button class="btn-secondary" style="margin-top:0;" onclick="snoozeBackup()">הזכר לי בעוד שבוע</button>
        </div>
      </div>`;
  } else {
    slot.innerHTML = '';
  }
}
function snoozeBackup(){
  setSnoozeUntil(Date.now() + 7*24*60*60*1000);
  renderBackupBanner();
}

/* ---------------- order book ---------------- */
const LS_ORDERS = 'clinica_orders';
function getOrders(){ return JSON.parse(localStorage.getItem(LS_ORDERS) || '[]'); }
function saveOrders(a){ localStorage.setItem(LS_ORDERS, JSON.stringify(a)); }
function renumberOrders(orders){
  orders.sort((a,b)=> a.number - b.number);
  orders.forEach((o,i)=>{ o.number = i+1; });
  return orders;
}
function todayDateInputValue(){ return todayISO(); } // yyyy-mm-dd, matches <input type=date>
function fmtMoney(n){
  const v = parseFloat(n);
  if(isNaN(v)) return '0';
  return v.toLocaleString('he-IL', {maximumFractionDigits:2});
}
function orderTotals(order){
  const paid = (order.payments||[]).reduce((s,p)=> s + (parseFloat(p.amount)||0), 0);
  const amount = parseFloat(order.amount) || 0;
  const debt = Math.round((amount - paid) * 100) / 100;
  return {paid, amount, debt};
}

let currentOrderId = null;
let orderCustomerTarget = 'of'; // 'of' (new order) or 'oe' (edit order)

function renderOrdersList(){
  const q = (document.getElementById('order-search-input').value || '').trim();
  let orders = getOrders();
  if(q){ orders = orders.filter(o => (o.customerName||'').includes(q)); }
  orders = orders.slice().sort((a,b)=> b.number - a.number);
  const container = document.getElementById('orders-list');
  if(orders.length===0){
    container.innerHTML = '<div class="empty">אין הזמנות תואמות</div>';
    return;
  }
  container.innerHTML = '';
  orders.forEach(o=>{
    const t = orderTotals(o);
    const statusColor = t.debt > 0 ? 'var(--danger)' : 'var(--ok)';
    const statusText = t.debt > 0 ? ('חוב: ₪'+fmtMoney(t.debt)) : 'שולם במלואו';
    const div = document.createElement('div');
    div.className = 'list-item';
    div.onclick = ()=>{ openOrderDetail(o.id); };
    div.innerHTML = `<div>
        <div class="name">#${o.number} · ${o.customerName||'(ללא שם)'}</div>
        <div class="sub2">${fmtDate(o.date)} · ${o.item||''}</div>
      </div>
      <div style="text-align:left;">
        <div style="font-weight:700; color:${statusColor}; font-size:13px;">${statusText}</div>
      </div>`;
    container.appendChild(div);
  });
}
document.getElementById('order-search-input').addEventListener('input', renderOrdersList);

function startNewOrder(){
  document.getElementById('of-date').value = todayDateInputValue();
  document.getElementById('of-customer-name').value = '';
  document.getElementById('of-item').value = 'משקפיים';
  document.getElementById('of-amount').value = '';
  document.getElementById('of-paid').value = '';
  document.getElementById('order-customer-suggestions').innerHTML = '';
  newOrderCustomerId = null;
  showScreen('screen-order-new');
}
let newOrderCustomerId = null;
let editOrderCustomerId = null;

function renderOrderCustomerSuggestions(which){
  which = which || 'of';
  const inputId = which==='oe' ? 'oe-customer-name' : 'of-customer-name';
  const slotId = which==='oe' ? 'order-customer-suggestions-oe' : 'order-customer-suggestions';
  const q = document.getElementById(inputId).value.trim();
  const slot = document.getElementById(slotId);
  if(!q){ slot.innerHTML=''; return; }
  const matches = getCustomers().filter(c => (c.firstName+' '+c.lastName).includes(q)).slice(0,5);
  if(matches.length===0){ slot.innerHTML=''; return; }
  slot.innerHTML = matches.map(c =>
    `<div class="list-item" style="margin-top:6px; padding:8px 12px;" onclick="pickOrderCustomer('${which}','${c.id}')">
       <div class="name" style="font-size:14px;">${c.firstName} ${c.lastName}</div>
       <div class="sub2">${c.phone||''}</div>
     </div>`
  ).join('');
}
function pickOrderCustomer(which, customerId){
  const c = getCustomers().find(x=>x.id===customerId);
  if(!c) return;
  const inputId = which==='oe' ? 'oe-customer-name' : 'of-customer-name';
  const slotId = which==='oe' ? 'order-customer-suggestions-oe' : 'order-customer-suggestions';
  document.getElementById(inputId).value = c.firstName+' '+c.lastName;
  document.getElementById(slotId).innerHTML = '';
  if(which==='oe'){ editOrderCustomerId = c.id; } else { newOrderCustomerId = c.id; }
}

function saveNewOrder(){
  const date = document.getElementById('of-date').value || todayDateInputValue();
  const customerName = document.getElementById('of-customer-name').value.trim();
  const item = document.getElementById('of-item').value.trim() || 'משקפיים';
  const amount = document.getElementById('of-amount').value.trim();
  const initialPaid = document.getElementById('of-paid').value.trim();
  if(!customerName){ alert('נא להזין שם לקוח'); return; }
  const order = {
    id: uid(),
    number: getOrders().length + 1,
    date,
    customerId: newOrderCustomerId,
    customerName,
    item,
    amount: amount || '0',
    payments: []
  };
  if(initialPaid && parseFloat(initialPaid) > 0){
    order.payments.push({ amount: initialPaid, date });
  }
  let orders = getOrders();
  orders.push(order);
  saveOrders(orders);
  showScreen('screen-order-detail');
  openOrderDetail(order.id);
}

function openOrderDetail(orderId){
  const order = getOrders().find(o=>o.id===orderId);
  if(!order) return;
  currentOrderId = orderId;
  const t = orderTotals(order);
  document.getElementById('od-number').textContent = order.number;
  document.getElementById('od-customer-name').textContent = order.customerName;
  document.getElementById('od-date').textContent = fmtDate(order.date);
  document.getElementById('od-item-display').textContent = order.item;
  document.getElementById('od-amount-display').textContent = '₪'+fmtMoney(t.amount);
  document.getElementById('od-paid-display').textContent = '₪'+fmtMoney(t.paid);
  const debtEl = document.getElementById('od-debt-display');
  debtEl.textContent = t.debt > 0 ? ('₪'+fmtMoney(t.debt)) : 'אין חוב';
  debtEl.style.color = t.debt > 0 ? 'var(--danger)' : 'var(--ok)';
  document.getElementById('op-amount').value = '';
  document.getElementById('op-date').value = todayDateInputValue();
  renderOrderPayments(order);
  showScreen('screen-order-detail');
}
function renderOrderPayments(order){
  const list = document.getElementById('od-payments-list');
  if(!order.payments || order.payments.length===0){
    list.innerHTML = '<div class="empty">אין תשלומים רשומים</div>';
    return;
  }
  const sorted = order.payments.slice().sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(p =>
    `<div class="exam-item" style="cursor:default;"><div class="exam-date">${fmtDate(p.date)}</div><div class="exam-preview">₪${fmtMoney(p.amount)}</div></div>`
  ).join('');
}
function addOrderPayment(){
  const amount = document.getElementById('op-amount').value.trim();
  const date = document.getElementById('op-date').value || todayDateInputValue();
  if(!amount || parseFloat(amount) <= 0){ alert('נא להזין סכום תשלום'); return; }
  let orders = getOrders();
  const order = orders.find(o=>o.id===currentOrderId);
  if(!order) return;
  order.payments = order.payments || [];
  order.payments.push({amount, date});
  saveOrders(orders);
  openOrderDetail(currentOrderId);
}
function deleteCurrentOrder(){
  if(!currentOrderId) return;
  if(!confirm('למחוק את ההזמנה הזו? הפעולה לא הפיכה, ומספרי ההזמנות שאחריה יזוזו כדי לשמור על רצף.')) return;
  let orders = getOrders();
  orders = orders.filter(o=>o.id!==currentOrderId);
  orders = renumberOrders(orders);
  saveOrders(orders);
  currentOrderId = null;
  showScreen('screen-orders');
}

function startEditOrder(){
  const order = getOrders().find(o=>o.id===currentOrderId);
  if(!order) return;
  document.getElementById('oe-number').textContent = order.number;
  document.getElementById('oe-date').value = order.date;
  document.getElementById('oe-customer-name').value = order.customerName;
  document.getElementById('oe-item').value = order.item;
  document.getElementById('oe-amount').value = order.amount;
  editOrderCustomerId = order.customerId || null;
  document.getElementById('order-customer-suggestions-oe').innerHTML = '';
  showScreen('screen-order-edit');
}
function cancelEditOrder(){
  showScreen('screen-order-detail');
  openOrderDetail(currentOrderId);
}
function saveEditOrder(){
  const date = document.getElementById('oe-date').value || todayDateInputValue();
  const customerName = document.getElementById('oe-customer-name').value.trim();
  const item = document.getElementById('oe-item').value.trim() || 'משקפיים';
  const amount = document.getElementById('oe-amount').value.trim();
  if(!customerName){ alert('נא להזין שם לקוח'); return; }
  let orders = getOrders();
  const order = orders.find(o=>o.id===currentOrderId);
  if(!order) return;
  order.date = date;
  order.customerName = customerName;
  order.customerId = editOrderCustomerId;
  order.item = item;
  order.amount = amount || '0';
  saveOrders(orders);
  showScreen('screen-order-detail');
  openOrderDetail(currentOrderId);
}

/* ---------------- init ---------------- */
renderCustomersList();
renderBackupBanner();
renderLastBackupDisplay();
</script>
